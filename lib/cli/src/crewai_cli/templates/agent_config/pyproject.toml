[project]
name = "{{package_name}}"
version = "0.1.0"
description = "A standalone CrewAI agent"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = ["{{crewai_dependency}}"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["{{definition}}", "tools"]

[tool.crewai]
type = "agent"
definition = "{{definition}}"
