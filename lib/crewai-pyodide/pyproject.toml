[project]
name = "crewai-pyodide"
dynamic = ["version"]
description = "Run CrewAI in the browser and Node.js on Pyodide (CPython compiled to WebAssembly)."
readme = "README.md"
authors = [
    { name = "Joao Moura", email = "joao@crewai.com" }
]
requires-python = ">=3.10, <3.14"
# Dependencies are installed inside Pyodide by `crewai_pyodide.install()`, which
# picks WebAssembly-compatible builds; see REQUIREMENTS in crewai_pyodide.
dependencies = []

[project.urls]
Homepage = "https://crewai.com"
Documentation = "https://docs.crewai.com"
Repository = "https://github.com/crewAIInc/crewAI"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/crewai_pyodide/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crewai_pyodide"]
