[project]
name = "openui-crewai-example"
version = "0.1.0"
description = "A CrewAI Flow rendered with OpenUI over AG-UI"
requires-python = ">=3.10,<3.14"
dependencies = [
  "ag-ui-crewai==0.3.0",
  "crewai==1.15.16",
  "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openui_crewai_example"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
