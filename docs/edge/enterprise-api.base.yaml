openapi: 3.0.3
info:
  title: CrewAI AMP API
  description: |
    REST API for interacting with your deployed CrewAI crews on CrewAI AMP.

    ## Getting Started

    1. **Find your crew URL**: Get your unique crew URL from the CrewAI AMP dashboard
    2. **Copy examples**: Use the code examples from each endpoint page as templates
    3. **Replace placeholders**: Update URLs and tokens with your actual values
    4. **Test with your tools**: Use cURL, Postman, or your preferred API client

    ## Authentication

    All API requests require a bearer token for authentication. There are two types of tokens:

    - **Bearer Token**: Organization-level token for full crew operations
    - **User Bearer Token**: User-scoped token for individual access with limited permissions

    You can find your bearer tokens in the Status tab of your crew's detail page in the CrewAI AMP dashboard.

    ## Reference Documentation

    This documentation provides comprehensive examples for each endpoint:

    - **Request formats** with all required and optional parameters
    - **Response examples** for success and error scenarios
    - **Code samples** in multiple programming languages
    - **Authentication patterns** with proper Bearer token usage

    Copy the examples and customize them with your actual crew URL and authentication tokens.

    ## Workflow

    1. **Discover inputs** using `GET /inputs`
    2. **Start execution** using `POST /kickoff`
    3. **Monitor progress** using `GET /status/{kickoff_id}`
  version: 1.0.0
  contact:
    name: CrewAI Support
    email: support@crewai.com
    url: https://crewai.com
servers:
  - url: https://your-actual-crew-name.crewai.com
    description: Replace with your actual deployed crew URL from the CrewAI AMP dashboard
  - url: https://my-travel-crew.crewai.com
    description: Example travel planning crew (replace with your URL)
  - url: https://content-creation-crew.crewai.com
    description: Example content creation crew (replace with your URL)
  - url: https://research-assistant-crew.crewai.com
    description: Example research assistant crew (replace with your URL)
security:
  - BearerAuth: []
paths:
  /inputs:
    get:
      summary: Get Required Inputs
      description: |
        **📋 Reference Example Only** - *This shows the request format. To test with your actual crew, copy the cURL example and replace the URL + token with your real values.*

        Retrieves the list of all required input parameters that your crew expects for execution.
        Use this endpoint to discover what inputs you need to provide when starting a crew execution.
      operationId: getRequiredInputs
      responses:
        "200":
          description: Successfully retrieved required inputs
          content:
            application/json:
              schema:
                type: object
                properties:
                  inputs:
                    type: array
                    items:
                      type: string
                    description: Array of required input parameter names
                    example: ["budget", "interests", "duration", "age"]
              examples:
                travel_crew:
                  summary: Travel planning crew inputs
                  value:
                    inputs: ["budget", "interests", "duration", "age"]
                outreach_crew:
                  summary: Outreach crew inputs
                  value:
                    inputs:
                      [
                        "name",
                        "title",
                        "company",
                        "industry",
                        "our_product",
                        "linkedin_url",
                      ]
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /kickoff:
    post:
      summary: Start Crew Execution
      description: |
        **📋 Reference Example Only** - *This shows the request format. To test with your actual crew, copy the cURL example and replace the URL + token with your real values.*

        Initiates a new crew execution with the provided inputs. Returns a kickoff ID that can be used
        to track the execution progress and retrieve results.

        Crew executions can take anywhere from seconds to minutes depending on their complexity.
        Consider using webhooks for real-time notifications or implement polling with the status endpoint.
      operationId: startCrewExecution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - inputs
              properties:
                inputs:
                  type: object
                  description: Key-value pairs of all required inputs for your crew
                  additionalProperties:
                    type: string
                  example:
                    budget: "1000 USD"
                    interests: "games, tech, ai, relaxing hikes, amazing food"
                    duration: "7 days"
                    age: "35"
                meta:
                  type: object
                  description: Additional metadata to pass to the crew
                  additionalProperties: true
                  example:
                    requestId: "user-request-12345"
                    source: "mobile-app"
                taskWebhookUrl:
                  type: string
                  format: uri
                  description: Callback URL executed after each task completion
                  example: "https://your-server.com/webhooks/task"
                stepWebhookUrl:
                  type: string
                  format: uri
                  description: Callback URL executed after each agent thought/action
                  example: "https://your-server.com/webhooks/step"
                crewWebhookUrl:
                  type: string
                  format: uri
                  description: Callback URL executed when the crew execution completes
                  example: "https://your-server.com/webhooks/crew"
            examples:
              travel_planning:
                summary: Travel planning crew
                value:
                  inputs:
                    budget: "1000 USD"
                    interests: "games, tech, ai, relaxing hikes, amazing food"
                    duration: "7 days"
                    age: "35"
                  meta:
                    requestId: "travel-req-123"
                    source: "web-app"
              outreach_campaign:
                summary: Outreach crew with webhooks
                value:
                  inputs:
                    name: "John Smith"
                    title: "CTO"
                    company: "TechCorp"
                    industry: "Software"
                    our_product: "AI Development Platform"
                    linkedin_url: "https://linkedin.com/in/johnsmith"
                  taskWebhookUrl: "https://api.example.com/webhooks/task"
                  crewWebhookUrl: "https://api.example.com/webhooks/crew"
      responses:
        "200":
          description: Crew execution started successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  kickoff_id:
                    type: string
                    format: uuid
                    description: Unique identifier for tracking this execution
                    example: "abcd1234-5678-90ef-ghij-klmnopqrstuv"
        "400":
          description: Invalid request body or missing required inputs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          description: Validation error - ensure all required inputs are provided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"

  /status/{kickoff_id}:
    get:
      summary: Get Execution Status
      description: |
        **📋 Reference Example Only** - *This shows the request format. To test with your actual crew, copy the cURL example and replace the URL + token with your real values.*

        Gets the status and the results of an execution. Use the kickoff ID from
        the /kickoff endpoint.

        The response always has the same shape. The `state` field gives the state
        of the execution. A field that does not apply is `null`.

        While the execution runs, `progress` and the event fields show what the
        execution does now. Send the request again to get a new response.

        A deployment that runs crewAI 1.15.21 or before gives `null` for
        `progress` and for the event fields. Upgrade the crewAI version in the
        project, then deploy the crew again.
      operationId: getExecutionStatus
      parameters:
        - name: kickoff_id
          in: path
          required: true
          description: The kickoff ID returned from the /kickoff endpoint
          schema:
            type: string
            format: uuid
            example: "abcd1234-5678-90ef-ghij-klmnopqrstuv"
      responses:
        "200":
          description: Successfully retrieved execution status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionStatus"
              examples:
                running:
                  summary: Crew execution in progress
                  value:
                    state: "RUNNING"
                    status: "Task is Running"
                    progress:
                      unit: "task"
                      completed: 1
                      total: 3
                      remaining: 2
                      current: "write_report"
                      current_agent: "Researcher"
                      started_at: "2025-09-10T18:00:00+00:00"
                      updated_at: "2025-09-10T18:02:14+00:00"
                      duration_seconds: 134.0
                    last_event:
                      type: "tool_usage_started"
                      timestamp: "2025-09-10T18:02:14+00:00"
                      tool_name: "SerperDevTool"
                      agent_role: "Researcher"
                    events_count: 24
                    events_by_type:
                      crew_kickoff_started: 1
                      task_started: 2
                      agent_execution_started: 2
                      tool_usage_started: 3
                    triggered_by:
                      type: "user"
                      id: "4711"
                    execution_origin: "api"
                    source: "memory"
                flow_running:
                  summary: Flow execution in progress
                  value:
                    state: "RUNNING"
                    status: "Task is Running"
                    progress:
                      unit: "step"
                      completed: 4
                      total: null
                      remaining: null
                      current: "summarize"
                      current_agent: null
                      started_at: "2025-09-10T18:00:00+00:00"
                      updated_at: "2025-09-10T18:00:41+00:00"
                      duration_seconds: 41.2
                    last_event:
                      type: "method_execution_started"
                      timestamp: "2025-09-10T18:00:41+00:00"
                      flow_name: "PoemFlow"
                      method_name: "summarize"
                    events_count: 13
                    execution_origin: "api"
                    source: "memory"
                completed:
                  summary: Execution completed successfully
                  value:
                    state: "SUCCESS"
                    result: "Comprehensive travel itinerary for 7 days in Japan..."
                    usage_metrics:
                      total_tokens: 18324
                      prompt_tokens: 15980
                      completion_tokens: 2344
                    progress:
                      unit: "task"
                      completed: 3
                      total: 3
                      remaining: 0
                      current: null
                      current_agent: null
                      started_at: "2025-09-10T18:00:00+00:00"
                      updated_at: "2025-09-10T18:04:22+00:00"
                      duration_seconds: 262.0
                    events_count: 31
                    triggered_by:
                      type: "user"
                      id: "4711"
                    execution_origin: "ui"
                    source: "memory"
                error:
                  summary: Execution failed
                  value:
                    state: "FAILED"
                    status: "Task execution failed: Invalid API key for external service"
                    last_event:
                      type: "task_failed"
                      timestamp: "2025-09-10T18:00:23+00:00"
                      task_name: "research_task"
                      error: "Invalid API key for external service"
                    events_count: 9
                    execution_origin: "api"
                    source: "memory"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Kickoff ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Execution not found"
                message: "No execution found with ID: abcd1234-5678-90ef-ghij-klmnopqrstuv"
        "500":
          $ref: "#/components/responses/ServerError"

  /resume:
    post:
      summary: Resume Crew Execution with Human Feedback
      description: |
        **📋 Reference Example Only** - *This shows the request format. To test with your actual crew, copy the cURL example and replace the URL + token with your real values.*

        Resume a paused crew execution with human feedback for Human-in-the-Loop (HITL) workflows.
        When a task with `human_input=True` completes, the crew execution pauses and waits for human feedback.

        **IMPORTANT**: You must provide the same webhook URLs (`taskWebhookUrl`, `stepWebhookUrl`, `crewWebhookUrl`)
        that were used in the original kickoff call. Webhook configurations are NOT automatically carried over -
        they must be explicitly provided in the resume request to continue receiving notifications.
      operationId: resumeCrewExecution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - execution_id
                - task_id
                - human_feedback
                - is_approve
              properties:
                execution_id:
                  type: string
                  format: uuid
                  description: The unique identifier for the crew execution (from kickoff)
                  example: "abcd1234-5678-90ef-ghij-klmnopqrstuv"
                task_id:
                  type: string
                  description: The ID of the task that requires human feedback
                  example: "research_task"
                human_feedback:
                  type: string
                  description: Your feedback on the task output. This will be incorporated as additional context for subsequent task executions.
                  example: "Great research! Please add more details about recent developments in the field."
                is_approve:
                  type: boolean
                  description: "Whether you approve the task output: true = positive feedback (continue), false = negative feedback (retry task)"
                  example: true
                taskWebhookUrl:
                  type: string
                  format: uri
                  description: Callback URL executed after each task completion. MUST be provided to continue receiving task notifications.
                  example: "https://your-server.com/webhooks/task"
                stepWebhookUrl:
                  type: string
                  format: uri
                  description: Callback URL executed after each agent thought/action. MUST be provided to continue receiving step notifications.
                  example: "https://your-server.com/webhooks/step"
                crewWebhookUrl:
                  type: string
                  format: uri
                  description: Callback URL executed when the crew execution completes. MUST be provided to receive completion notification.
                  example: "https://your-server.com/webhooks/crew"
            examples:
              approve_and_continue:
                summary: Approve task and continue execution
                value:
                  execution_id: "abcd1234-5678-90ef-ghij-klmnopqrstuv"
                  task_id: "research_task"
                  human_feedback: "Excellent research! Proceed to the next task."
                  is_approve: true
                  taskWebhookUrl: "https://api.example.com/webhooks/task"
                  stepWebhookUrl: "https://api.example.com/webhooks/step"
                  crewWebhookUrl: "https://api.example.com/webhooks/crew"
              request_revision:
                summary: Request task revision with feedback
                value:
                  execution_id: "abcd1234-5678-90ef-ghij-klmnopqrstuv"
                  task_id: "analysis_task"
                  human_feedback: "Please include more quantitative data and cite your sources."
                  is_approve: false
                  taskWebhookUrl: "https://api.example.com/webhooks/task"
                  crewWebhookUrl: "https://api.example.com/webhooks/crew"
      responses:
        "200":
          description: Execution resumed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: ["resumed", "retrying", "completed"]
                    description: Status of the resumed execution
                    example: "resumed"
                  message:
                    type: string
                    description: Human-readable message about the resume operation
                    example: "Execution resumed successfully"
              examples:
                resumed:
                  summary: Execution resumed with positive feedback
                  value:
                    status: "resumed"
                    message: "Execution resumed successfully"
                retrying:
                  summary: Task will be retried with negative feedback
                  value:
                    status: "retrying"
                    message: "Task will be retried with your feedback"
        "400":
          description: Invalid request body or execution not in pending state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Invalid Request"
                message: "Execution is not in pending human input state"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          description: Execution ID or Task ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error: "Not Found"
                message: "Execution ID not found"
        "500":
          $ref: "#/components/responses/ServerError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        **📋 Reference Documentation** - *The tokens shown in examples are placeholders for reference only.*

        Use your actual Bearer Token or User Bearer Token from the CrewAI AMP dashboard for real API calls.

        **Bearer Token**: Organization-level access for full crew operations
        **User Bearer Token**: User-scoped access with limited permissions

  schemas:
    ExecutionStatus:
      type: object
      description: |
        The status of one execution.

        The response always has the same shape. The `state` field gives the
        state of the execution. A field that does not apply is `null`.
      properties:
        state:
          type: string
          enum:
            ["PENDING", "STARTED", "RUNNING", "SUCCESS", "FAILED", "PAUSED", "REVOKED"]
          description: The state of the execution
          example: "RUNNING"
        status:
          type: string
          nullable: true
          description: A short message about the state
          example: "Task is Running"
        result:
          type: string
          nullable: true
          description: The final output. The field is null until the execution stops.
          example: "Comprehensive travel itinerary for 7 days in Japan..."
        result_json:
          type: object
          nullable: true
          description: The final output as JSON, if the output is a JSON object
        usage_metrics:
          type: object
          nullable: true
          additionalProperties:
            type: integer
          description: The token counts for the execution
          example: { total_tokens: 18324, prompt_tokens: 15980, completion_tokens: 2344 }
        progress:
          nullable: true
          description: How much of the work is complete
          allOf:
            - $ref: "#/components/schemas/ExecutionProgress"
        last_event:
          nullable: true
          description: The most recent event
          allOf:
            - $ref: "#/components/schemas/ExecutionEvent"
        events:
          type: array
          nullable: true
          description: |
            The 100 most recent events. The oldest event is first. Set
            `CREWAI_STATUS_MAX_EVENTS` on the deployment to change the number.
          items:
            $ref: "#/components/schemas/ExecutionEvent"
        events_count:
          type: integer
          nullable: true
          description: |
            The number of events that the execution sent. The number can be more
            than the length of `events`.
          example: 24
        events_by_type:
          type: object
          nullable: true
          additionalProperties:
            type: integer
          description: The number of events of each type
          example: { crew_kickoff_started: 1, task_started: 2, tool_usage_started: 3 }
        triggered_by:
          nullable: true
          description: The identity that started the execution
          allOf:
            - $ref: "#/components/schemas/ExecutionPrincipal"
        execution_origin:
          type: string
          nullable: true
          enum: ["ui", "schedule", "trigger", "chat", "hitl-resume", "replay", "api"]
          description: |
            How the execution started. A request to the API of the deployment
            gives `api`.
          example: "api"
        last_step:
          type: object
          nullable: true
          description: The most recent agent step. Crews only.
        last_executed_task:
          type: object
          nullable: true
          description: The most recent task that the crew completed. Crews only.
        flow_id:
          type: string
          nullable: true
          description: The identifier of a flow that waits for human feedback
        source:
          type: string
          enum: ["memory", "application"]
          description: |
            The source of the data. A response that has `application` comes from
            the platform and gives no progress data and no event data.
          example: "memory"

    ExecutionProgress:
      type: object
      description: |
        How much of the work is complete.

        A crew counts tasks. A flow counts steps. A flow selects the next step
        while it runs. The number of steps is not known before the flow stops.
        Thus `total` and `remaining` are always null for a flow.
      properties:
        unit:
          type: string
          enum: ["task", "step"]
          description: The unit of work
          example: "task"
        completed:
          type: integer
          description: The number of units that are complete
          example: 1
        total:
          type: integer
          nullable: true
          description: The number of units in the execution
          example: 3
        remaining:
          type: integer
          nullable: true
          description: The number of units that are not complete
          example: 2
        current:
          type: string
          nullable: true
          description: The name of the task or the method that runs now
          example: "write_report"
        current_agent:
          type: string
          nullable: true
          description: The role of the agent that works now
          example: "Researcher"
        started_at:
          type: string
          format: date-time
          nullable: true
          description: The time when the worker started the execution
          example: "2025-09-10T18:00:00+00:00"
        updated_at:
          type: string
          format: date-time
          nullable: true
          description: The time of the most recent change
          example: "2025-09-10T18:02:14+00:00"
        duration_seconds:
          type: number
          nullable: true
          description: The number of seconds from the start to `updated_at`
          example: 134.0

    ExecutionEvent:
      type: object
      description: |
        A summary of one event.

        An event does not contain the prompts, the outputs or the state of the
        flow. A field is present only when the event has a value for it.
      properties:
        type:
          type: string
          description: The type of the event
          example: "tool_usage_started"
        timestamp:
          type: string
          format: date-time
          nullable: true
          description: The time of the event
          example: "2025-09-10T18:02:14+00:00"
        crew_name:
          type: string
          description: The name of the crew
        flow_name:
          type: string
          description: The name of the flow
        method_name:
          type: string
          description: The name of the flow method
        task_name:
          type: string
          description: The name of the task
        agent_role:
          type: string
          description: The role of the agent
          example: "Researcher"
        tool_name:
          type: string
          description: The name of the tool
          example: "SerperDevTool"
        model:
          type: string
          description: The name of the model
        error:
          type: string
          description: The error message

    ExecutionPrincipal:
      type: object
      description: |
        The identity that started the execution.

        The response gives the type and the identifier only. It does not give
        the name, the email address or the organization. Each token for a
        deployment can read the status of each execution of that deployment.
      properties:
        type:
          type: string
          enum: ["user", "service_account", "unknown"]
          description: |
            The type of the identity. A request that uses the static
            `AUTH_TOKEN` of the deployment gives `unknown`.
          example: "user"
        id:
          type: string
          nullable: true
          description: The identifier of the identity in CrewAI AMP
          example: "4711"

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error type or title
          example: "Authentication Error"
        message:
          type: string
          description: Detailed error message
          example: "Invalid bearer token provided"

    ValidationError:
      type: object
      properties:
        error:
          type: string
          example: "Validation Error"
        message:
          type: string
          example: "Missing required inputs"
        details:
          type: object
          properties:
            missing_inputs:
              type: array
              items:
                type: string
              example: ["budget", "interests"]

  responses:
    UnauthorizedError:
      description: Authentication failed - check your bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Unauthorized"
            message: "Invalid or missing bearer token"

    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Not Found"
            message: "The requested resource was not found"

    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error: "Internal Server Error"
            message: "An unexpected error occurred"
