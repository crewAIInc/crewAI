name: Run Type Checks

on:
  pull_request:
    # Do not start this workflow for docs/markdown/Actions-only PRs.
    # Required check name `type-checker` for those PRs is reported by
    # non-code-ci-status.yml so branch protection does not hang.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.mdx'
      - '.github/**'

permissions:
  contents: read

jobs:
  type-checker-matrix:
    name: type-checker (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Restore global uv cache
        id: cache-restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
            .venv
          key: uv-main-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-main-py${{ matrix.python-version }}-

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: false

      - name: Install dependencies
        run: uv sync --all-groups --all-extras

      - name: Run type checks
        run: uv run mypy lib/

      - name: Save uv caches
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
            .venv
          key: uv-main-py${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}

  # Summary job to provide single status for branch protection
  type-checker:
    name: type-checker
    runs-on: ubuntu-latest
    needs: [type-checker-matrix]
    if: always()
    steps:
      - name: Check results
        run: |
          if [ "${{ needs.type-checker-matrix.result }}" == "success" ]; then
            echo "All type checks passed"
          else
            echo "Type checks failed"
            exit 1
          fi
