name: Route community-tool issues

on:
  issues:
    types: [labeled]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: route-community-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  route:
    if: >
      github.event.label.name == 'crewai-community' &&
      github.event.issue.pull_request == null
    runs-on: ubuntu-latest
    steps:
      - name: Close the issue and linked pull requests
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue = context.payload.issue;
            const marker = "<!-- crewai-community-routing -->";
            const message = [
              marker,
              "",
              "Thanks for the contribution! This request is a better fit for the [CrewAI Community Tools repository](https://github.com/crewAIInc/crewai-community-tools).",
              "",
              "Please open an issue there and submit the corresponding pull request there as well.",
            ].join("\\n");

            const timeline = await github.paginate(
              github.rest.issues.listEventsForTimeline,
              { owner, repo, issue_number: issue.number, per_page: 100 },
            );
            const pullRequestNumbers = new Set(
              timeline
                .filter(
                  (event) =>
                    event.event === "cross-referenced" &&
                    event.source?.issue?.pull_request,
                )
                .map((event) => event.source.issue.number),
            );

            for (const pull_number of pullRequestNumbers) {
              const { data: pull } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number,
              });
              if (pull.state === "open") {
                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number,
                  state: "closed",
                });
              }
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issue.number, per_page: 100 },
            );
            if (!comments.some((comment) => comment.body?.includes(marker))) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: message,
              });
            }

            if (issue.state === "open") {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: issue.number,
                state: "closed",
              });
            }
