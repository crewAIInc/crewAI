name: Bartholomew AST Invariant Sentinel

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  btp-guard:
    name: Deterministic AST Invariant Sentinel & Secret Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Bartholomew Invariant Sentinel
        # Pinned to immutable commit SHA to comply with CI security policy
        uses: staccFoxx/bartholomew@bc0bf96f91e75c3012c3980895253471242ddafd
        with:
          audit-path: "."
          fail-on-violation: false
          min-score: 80
