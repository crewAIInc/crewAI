name: Close PRs associated with closed issues

on:
  issues:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  close-associated-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Close open associated pull requests
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const query = `
              query($owner: String!, $repo: String!, $issueNumber: Int!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  issue(number: $issueNumber) {
                    timelineItems(
                      first: 100
                      after: $cursor
                      itemTypes: [CROSS_REFERENCED_EVENT]
                    ) {
                      nodes {
                        ... on CrossReferencedEvent {
                          source {
                            __typename
                            ... on PullRequest {
                              number
                              state
                            }
                          }
                        }
                      }
                      pageInfo {
                        hasNextPage
                        endCursor
                      }
                    }
                  }
                }
              }
            `;

            const pullRequests = new Set();
            let cursor = null;

            do {
              const result = await github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issueNumber: context.payload.issue.number,
                cursor,
              });
              const timeline = result.repository.issue.timelineItems;

              for (const item of timeline.nodes) {
                if (item.source?.__typename === "PullRequest" && item.source.state === "OPEN") {
                  pullRequests.add(item.source.number);
                }
              }

              cursor = timeline.pageInfo.hasNextPage ? timeline.pageInfo.endCursor : null;
            } while (cursor);

            for (const pullNumber of pullRequests) {
              core.info(`Closing pull request #${pullNumber} associated with issue #${context.payload.issue.number}.`);
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullNumber,
                state: "closed",
              });
            }
